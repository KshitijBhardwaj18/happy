apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: python:3.12-slim
          command: ["python", "/app/app.py"]
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: "frontend"
            - name: LEAK_MB
              value: "0"
            - name: CRASH_ON_START
              value: "false"
            - name: ERROR_RATE
              value: "0"
            - name: LATENCY_MS
              value: "0"
          volumeMounts:
            - name: app-code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: app-code
          configMap:
            name: shop-app
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shop
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
