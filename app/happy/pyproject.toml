[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "happy"
version = "0.1.0"
description = "Happy: the on-call engineer's background helper. Strands + AgentCore."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore[strands-agents] >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "boto3 >= 1.35.0",
    "mcp ~= 1.24.0",
    "strands-agents[otel] >= 1.55.0",
    "strands-agents-tools[agent_core_code_interpreter] >= 0.2.0",
    "kubernetes >= 31.0.0",
    "slack_sdk >= 3.33.0",
    "PyGithub >= 2.5.0",
    "pydantic >= 2.9.0",
    "pydantic-settings >= 2.6.0",
    "python-dotenv >= 1.0.1",
]

[project.optional-dependencies]
dev = ["pytest >= 8.3.0", "pytest-asyncio >= 0.24.0"]

[project.scripts]
happy = "cli:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
